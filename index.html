 if(!sw&&MT(a,['ip','interface','brief']))return tb(['Interface','IP-Address','Status','Protocol'],Object.keys(d.ifs).map(k=>{const i=d.ifs[k],l=LK.find(x=>(x[0]==d.n&&x[1]==k)||(x[2]==d.n&&x[3]==k));return[k,i.ip||'unassigned',i.up?'up':'administratively down',i.up&&lu(l)?'up':'down']}));

  if(!sw&&t[0].length>3&&T('shutdown')){i.up=0;return''}
